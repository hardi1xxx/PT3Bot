<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Integrated Tracking System</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #3552c4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }

  .card {
    background: #fff; border-radius: 24px; box-shadow: 0 30px 70px rgba(15, 23, 60, .35);
    width: 100%; max-width: 960px; display: flex; overflow: hidden; min-height: 560px;
  }

  /* ── Left: brand panel + illustration ── */
  .left-panel {
    flex: 1 1 46%; padding: 44px 40px 24px; display: flex; flex-direction: column;
    align-items: center; text-align: center;
  }
  .left-panel h1 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin: 0 0 4px; }
  .left-panel .version { font-size: 0.72rem; color: #94a3b8; margin: 0 0 20px; }
  .illustration { width: 100%; max-width: 340px; flex: 1 1 auto; display: flex; align-items: center; }

  /* ── Right: login form panel ── */
  .right-panel {
    flex: 1 1 54%; background: #f4f6fb; padding: 36px 48px; display: flex; flex-direction: column;
  }
  .brand-logos { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 26px; flex-wrap: wrap; }
  .brand-logos img { height: 40px; width: auto; object-fit: contain; }

  .right-panel h2 { text-align: center; font-size: 1.15rem; font-weight: 800; color: #0f172a; margin: 0 0 6px; }
  .right-panel .user-login { text-align: center; font-size: 1rem; font-weight: 800; color: #1d4ed8; margin: 0 0 2px; }
  .right-panel .sub { text-align: center; color: #94a3b8; font-size: 0.78rem; margin: 0 0 22px; }

  form { max-width: 340px; width: 100%; margin: 0 auto; }

  label { display: block; font-size: 0.75rem; font-weight: 700; color: #1d4ed8; margin-bottom: 4px; }
  .field-wrap { position: relative; margin-bottom: 4px; }
  input[type="password"], input[type="text"] {
    width: 100%; padding: 11px 42px 11px 14px; border-radius: 10px; border: 1px solid #bfdbfe;
    background: #eff6ff; font-size: 0.95rem; color: #1e293b;
  }
  input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.25); }
  .toggle-eye {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    cursor: pointer; color: #64748b; background: none; border: none; padding: 4px; display: flex;
  }
  .toggle-eye:hover { color: #1d4ed8; }

  .forgot { text-align: center; font-size: 0.72rem; color: #64748b; margin: 8px 0 18px; }
  .forgot a { color: #1d4ed8; text-decoration: none; }
  .forgot a:hover { text-decoration: underline; }

  button.login-btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px; background: #1d4ed8; color: #fff;
    font-weight: 800; font-size: 0.92rem; letter-spacing: 0.03em; cursor: pointer;
  }
  button.login-btn:hover { background: #1e3a8a; }

  .signup-hint { text-align: center; font-size: 0.72rem; color: #94a3b8; margin: 12px 0 0; }
  .signup-hint a { color: #1d4ed8; text-decoration: none; }

  .error {
    max-width: 340px; margin: 0 auto 14px; background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
    border-radius: 10px; padding: 8px 12px; font-size: 0.78rem; text-align: center;
  }

  .footer { text-align: center; font-size: 0.66rem; color: #94a3b8; margin-top: auto; padding-top: 20px; }

  @media (max-width: 760px) {
    .card { flex-direction: column; min-height: 0; }
    .left-panel { padding: 32px 24px 12px; }
    .illustration { max-width: 240px; }
    .right-panel { padding: 28px 24px; }
  }
</style>
</head>
<body>
  <div class="card">

    <div class="left-panel">
      <h1>Integrated Tracking System</h1>
      <p class="version">Development Version 0.0.1</p>
      <div class="illustration">
        <img src="{{ url_for('static', filename='img/illustration.png') }}" alt="Illustration of a person using a computer">  
      </div>
    </div>

    <div class="right-panel">
      <div class="brand-logos">
        <!-- Ganti src di bawah dengan file logo resmi masing-masing di /static/img/.
             Sengaja tidak digambar ulang di sini karena logo perusahaan adalah aset bermerek. -->
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Telkom Indonesia TELKOMAKSES INFRANEXIA">
        <img src="{{ url_for('static', filename='img/logo-danantara.png') }}" alt="TELKOMSEL">
      </div>

      <h2>Welcome to application,</h2>
      <p class="user-login">User Login</p>
      <p class="sub">Please log in to continue</p>

      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}">
        <label for="password">Password</label>
        <div class="field-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
          <button type="button" class="toggle-eye" id="togglePassword" aria-label="Tampilkan password" tabindex="-1">
            <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <p class="forgot">Forgot your password ? <a href="mailto:hardi.hidayat@telkomakses.co.id">contact admin</a></p>

        <button type="submit" class="login-btn">LOGIN</button>
        <p class="signup-hint">Dont have an account? <a href="mailto:hardi.hidayat@telkomakses.co.id">contact admin</a></p>
      </form>

      <p class="footer">&copy; 2026. Integrated Tracking System</p>
    </div>

  </div>

  <script>
    const pwInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOpen = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>';
    const eyeClosed = '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a20.3 20.3 0 0 1 5.06-5.94M9.9 4.24A10.5 10.5 0 0 1 12 4c7 0 11 8 11 8a20.3 20.3 0 0 1-3.22 4.36M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    toggleBtn.addEventListener('click', () => {
      const isPassword = pwInput.type === 'password';
      pwInput.type = isPassword ? 'text' : 'password';
      eyeIcon.innerHTML = isPassword ? eyeClosed : eyeOpen;
    });
  </script>
</body>
</html>
