<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INTRA — INtegrated TRAcking</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #171e2e;
    --panel-alt: #1f273a;
    --text: #e7ebf3;
    --muted: #94a3b8;
    --brand-blue: #2f6fed;
    --brand-blue-2: #1b3a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; background: var(--panel); border-bottom: 1px solid #232c40;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { height: 38px; width: auto; display: block; }
  .user-box { display: flex; align-items: center; gap: 12px; font-size: 0.85rem; }
  .user-box .role-badge {
    font-size: 0.68rem; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--brand-blue-2); color: #bcd0ff; border: 1px solid #2c4a9e;
  }
  .user-box a.logout {
    color: var(--muted); text-decoration: none; font-size: 0.8rem;
    border: 1px solid #2b3550; padding: 5px 12px; border-radius: 8px;
  }
  .user-box a.logout:hover { color: #f87171; border-color: #7f1d1d; }

  main { max-width: 1100px; margin: 0 auto; padding: 40px 24px 60px; }
  .hero { text-align: center; margin-bottom: 34px; }
  .hero h1 { font-size: 1.5rem; margin: 0 0 6px; font-weight: 800; }
  .hero p { color: var(--muted); margin: 0; font-size: 0.9rem; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px; margin-bottom: 44px;
  }
  .card {
    background: var(--panel); border: 1px solid #232c40; border-radius: 14px;
    padding: 20px; text-decoration: none; color: var(--text); transition: border-color .15s, transform .15s;
    display: flex; flex-direction: column; gap: 6px; min-height: 118px;
  }
  .card:hover { border-color: var(--brand-blue); transform: translateY(-2px); }
  .card .label { font-weight: 800; font-size: 1.1rem; }
  .card .desc { font-size: 0.78rem; color: var(--muted); flex: 1; }
  .card .status-tag {
    align-self: flex-start; font-size: 0.65rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px; margin-top: 4px;
  }
  .card.active .status-tag { background: #113a24; color: #4ade80; border: 1px solid #1f6b3f; }
  .card.soon {
    opacity: 0.5; cursor: not-allowed; pointer-events: none;
  }
  .card.soon .status-tag { background: #332a13; color: #eab308; border: 1px solid #6b551f; }

  .partners { text-align: center; padding-top: 24px; border-top: 1px solid #232c40; }
  .partners .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 14px; }
  .partner-row { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }
  .partner-chip {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    background: var(--panel); border: 1px solid #232c40; border-radius: 999px;
    font-size: 0.82rem; font-weight: 700; color: #cbd5e1;
  }
  .partner-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="{{ url_for('static', filename='img/intra-logo.png') }}" alt="INTRA logo">
  </div>
  <div class="user-box">
    <span>{{ user.name }}</span>
    <span class="role-badge">{{ role_label }}</span>
    <a class="logout" href="{{ url_for('logout') }}">Keluar</a>
  </div>
</header>

<main>
  <div class="hero">
    <h1>Pilih Project</h1>
    <p>One Data &bull; One Process &bull; One Goal</p>
  </div>

  <div class="grid">
    {% for m in menus %}
      {% if m.status == 'active' %}
        <a class="card active" href="{{ m.url }}">
          <div class="label">{{ m.label }}</div>
          <div class="desc">{{ m.desc }}</div>
          <div class="status-tag">AKTIF</div>
        </a>
      {% else %}
        <div class="card soon">
          <div class="label">{{ m.label }}</div>
          <div class="desc">{{ m.desc }}</div>
          <div class="status-tag">SEGERA HADIR</div>
        </div>
      {% endif %}
    {% endfor %}
  </div>

  <!-- Catatan: chip di bawah ini teks/badge sederhana, BUKAN logo resmi
       Telkom Akses/Infranexia/Telkomsel (tidak ada file logo asli yang
       diupload untuk ketiganya). Kalau Anda punya file logo resminya
       (PNG/SVG), kirim ke saya -- tinggal saya ganti <div class="dot">
       di bawah jadi <img src="..."> yang sesuai. -->
  <div class="partners">
    <div class="label">Kolaborasi</div>
    <div class="partner-row">
      <div class="partner-chip"><span class="dot" style="background:#e30613;"></span> Telkom Akses</div>
      <div class="partner-chip"><span class="dot" style="background:#ef4444;"></span> Telkomsel</div>
      <div class="partner-chip"><span class="dot" style="background:#2f6fed;"></span> Infranexia</div>
    </div>
  </div>
</main>

</body>
</html>
